# mac_limit_guard.conf - policy for the QFX5130 MAC-limit guard.
#
# Installed to /var/db/scripts/mac_limit_guard.conf on each switch.
# See README.md, and groups/MAC-LIMIT.txt in the base-config repo for how the
# guard is started and why it exists.
#
# This file is parsed with Python's ast module. ONLY simple
#     NAME = <literal>
# assignments are allowed - no imports, no function calls, no expressions, no
# string concatenation. Anything else is rejected and the guard logs
# CONFIGURATION INVALID and performs NO enforcement. That is deliberate: the
# file is not exec()'d, so a bad edit cannot run code as root.
#
# ---------------------------------------------------------------------------
# THIS FILE IS PER-BOX AND PER-CUSTOMER. It is edited in place on the switch.
# mac-limit-push.sh will NOT overwrite an existing copy, so limits set here
# survive a re-push.
# ---------------------------------------------------------------------------
#
# ENFORCEMENT IS OPT-IN PER INTERFACE.
# An interface that is not named in one of the four tables below is NOT
# enforced, whatever DEFAULT_MAC_LIMIT says. DEFAULT_MAC_LIMIT is dead code:
# the script validates it, stores it, and never reads it again. It is still a
# REQUIRED key, so it has to stay - but do not expect it to do anything.
# The tables are the whole policy. This file ships with all four empty, which
# means the guard runs every 60 seconds and enforces nothing - a safe
# baseline until a customer that needs a limit is provisioned.
#
# PRECEDENCE (first match wins):
#   1. PER_IFL_LIMIT_EXACT     exact logical interface, e.g. "et-0/0/12.1001"
#   2. PER_IFL_LIMIT_REGEX     first matching regex, tested against the IFL
#   3. PER_IFD_LIMIT_EXACT     exact physical interface, applies to ALL units
#   4. PER_IFD_LIMIT_REGEX     first matching regex, tested against the IFD
#
# On a violation the guard logs to syslog and shuts the interface or
# subinterface. Watch it with:  monitor start messages | match mac_limit_guard
#
# ---------------------------------------------------------------------------
# Current VLAN map, for the examples below:
#   200  MGMT-VLAN       VNI 69200
#   420  TBAX-IX         VNI 69420
#   645  WOW-IX          VNI 69645
#   2000-4092  customer PVLANs (PVLAN-CUST), VNI 30<VLAN>
#              assign from 2000; 4092 is reserved as the service number
# ---------------------------------------------------------------------------

# Required by the parser. Has no effect - see the note above.
DEFAULT_MAC_LIMIT = 2

# Scheduler. 4 runs, 15s apart, covers the 60s event interval.
# Lower RUN_INTERVAL_SECONDS to catch a flood sooner, at the cost of more
# CPU: the MAC table is walked on every pass.
RUN_COUNT = 4
RUN_INTERVAL_SECONDS = 15

# Exact logical interfaces (IFL). Most precise - use this to limit one
# customer's subinterface without touching the rest of the port.
#
#   PER_IFL_LIMIT_EXACT = {
#       "et-0/0/12.420": 4,
#       "et-0/0/12.2000": 2,
#   }
PER_IFL_LIMIT_EXACT = {}

# Exact physical interfaces (IFD). Applies to EVERY unit on the port.
#
#   PER_IFD_LIMIT_EXACT = {
#       "et-0/0/48": 2,
#   }
PER_IFD_LIMIT_EXACT = {}

# Regex logical-interface rules. Tested against the full IFL. Useful for a
# customer whose PVLAN sits on one port under several VLANs.
#
#   PER_IFL_LIMIT_REGEX = [
#       (r"^et-0/0/12\.(420|2000|2001)$", 4),
#   ]
PER_IFL_LIMIT_REGEX = []

# Regex physical-interface rules. Tested against the IFD.
#
#   PER_IFD_LIMIT_REGEX = [
#       (r"^et-0/0/4[1-5]$", 2),
#   ]
PER_IFD_LIMIT_REGEX = []
